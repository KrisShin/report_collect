# 生产环境 Redis（Docker）
# 用法：在 deploy 目录执行
#   REDIS_PASSWORD=<强密码> docker compose up -d
services:
  redis:
    image: redis:7-alpine
    container_name: reportc-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?please set REDIS_PASSWORD}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
